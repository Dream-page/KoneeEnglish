          return String(value).replace(/[&<>"']/g, function (ch) {

        }

        const flushOneLocal = async (key, signedInUser) => {
            if (!signedInUser || pendingJobs.has(key)) return;
            const pendingKey = pendingKeyForLocal(key);
            if (localStorage.getItem(pendingKey) !== '1') return;
            pendingJobs.add(key);
            try {
                // 입력이 진행 중이면 가장 마지막 버전까지 연속 업로드.
                for (let tries = 0; tries < 8; tries++) {

                    const version = payload.updatedAt || 0;

            91: { title: "I must admit~ (~을 인정해야 해)", time: "8:40:57 ~ 8:44:50" },
            92: { title: "I feel like~ (~인 것 같은 기분이야)", time: "8:45:00 ~ 8:49:12" },
            93: { title: "It seems like~ (~인듯 해)", time: "8:49:23 ~ 8:53:18" },
            94: { title: "I like the way~ (~그대로(인채)가 좋아)", time: "8:53:29 ~ 8:57:42" },
            95: { title: "I wonder if~ (~인지 궁금해)", time: "8:57:54 ~ 9:02:09" },
            96: { title: "Do you mind if I~ (내가 ~해도 괜찮지?)", time: "9:02:19 ~ 9:06:43" },
            97: { title: "I used to~ (예전에 ~ 했었어)", time: "9:06:53 ~ 9:10:48" },
            98: { title: "I look forward to~ (~이 기대돼)", time: "9:10:58 ~ 9:14:53" },
            99: { title: "I came up with~ (~을 생각해냈어)", time: "9:15:03 ~ 9:19:55" },
            100: { title: "Make sure~ (꼭 ~해야 해 / 절대 ~하면 안돼)", time: "미제공" }
        };

        // 각 Day별 기본 빈 10문장 세트 생성 (1번 칸에는 핵심 패턴 뼈대 자동 표시)
        const getInitialSentencesForDay = (day) => {
            const topicStr = dayScheduleData[day]?.title || "";
            const match = topicStr.match(/^(.+?)\s*\((.+)\)$/);
            const patternEng = match ? match[1].trim() : "";
            const patternKor = match ? match[2].trim() : "";

            return Array.from({ length: 10 }, (_, idx) => {
                if (idx === 0 && patternEng) {
                    return { eng: patternEng, kor: patternKor, highlight: false };
                }
                return { eng: "", kor: "", highlight: false };
            });
        };

        const StudyApp = () => {
            const [user, setUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('기기에 저장됨 · 로그인 후 클라우드 백업');
            const [storageFailure, setStorageFailure] = useState(false);
            const [authReady, setAuthReady] = useState(false);
            const [loginBusy, setLoginBusy] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [pushBusy, setPushBusy] = useState(false);
            const [pushStatus, setPushStatus] = useState('알림 설정을 확인해 주세요.');
            const [pushEnabled, setPushEnabled] = useState(false);
            
            const [editingNoteId, setEditingNoteId] = useState(null);
            const [editEng, setEditEng] = useState("");
            const [editKor, setEditKor] = useState("");
            const [editTag, setEditTag] = useState("");
            const [showDayListModal, setShowDayListModal] = useState(false);
            const [daySearchQuery, setDaySearchQuery] = useState("");
            const [toastMessage, setToastMessage] = useState("");

            const [currentDay, setCurrentDay] = useState(() => {
                const savedDay = localStorage.getItem('koneeLastVisitedDay');
                const parsed = savedDay ? parseInt(savedDay) : 1;
                return (parsed >= 1 && parsed <= 100) ? parsed : 1;
            });
            const [isEditingDay, setIsEditingDay] = useState(false);
            const [tempDay, setTempDay] = useState(currentDay); 

            const [sentences, setSentences] = useState(() => {
                try {
                    const localSaved = localStorage.getItem(`konee_local_day_${currentDay}`);
                    if (localSaved) {
                        const parsed = JSON.parse(localSaved);
                        if (parsed.sentences) return parsed.sentences;
                    }
                } catch (e) {}
                return getInitialSentencesForDay(currentDay);
            });
            const [notes, setNotes] = useState(() => {
                try {
                    const localGlobal = localStorage.getItem('konee_local_global');
                    if (localGlobal) {
                        const parsed = JSON.parse(localGlobal);
                        if (parsed.notes) return parsed.notes;
                    }
                } catch (e) {}
                return [];
            });
            const [completedDates, setCompletedDates] = useState(() => {
                try {
                    const localGlobal = localStorage.getItem('konee_local_global');
                    if (localGlobal) {
                        const parsed = JSON.parse(localGlobal);
                        if (parsed.completedDates) return normalizeDates(parsed.completedDates);
                    }
                } catch (e) {}
                return [];
            });
            
            const [topic, setTopic] = useState(dayScheduleData[currentDay]?.title || "");
            const [isEditingTopic, setIsEditingTopic] = useState(false);
            const [tempTopic, setTempTopic] = useState("");
            
            const [activeTab, setActiveTab] = useState('challenge'); 
            const [viewDate, setViewDate] = useState(new Date());

            const TIMER_SECONDS = 30 * 60;
            const SILVER_SECONDS = 15 * 60;
            const [timeLeft, setTimeLeft] = useState(TIMER_SECONDS);
            const [isActive, setIsActive] = useState(false);
            const [timerEndTime, setTimerEndTime] = useState(null); 
            
            const [showCelebration, setShowCelebration] = useState(false);
            const [hideEnglish, setHideEnglish] = useState(false);
            const [revealedIndices, setRevealedIndices] = useState([]);
            const [newNoteEng, setNewNoteEng] = useState("");
            const [newNoteKor, setNewNoteKor] = useState("");

            const [repetitionCount, setRepetitionCount] = useState(0);
            const [silverAwarded, setSilverAwarded] = useState(false); 

            // 검색 & 필터 State
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedTag, setSelectedTag] = useState("");
            const [showHighlightedOnly, setShowHighlightedOnly] = useState(false);

            const [newNoteTag, setNewNoteTag] = useState("");
            const [showRandomReview, setShowRandomReview] = useState(false);
            const [randomNotes, setRandomNotes] = useState([]);

            const [notesPage, setNotesPage] = useState(1);
            const NOTES_PER_PAGE = 10;

            // 글로벌 하이라이트 모아보기 State
            const [globalHighlights, setGlobalHighlights] = useState([]);
            const [isLoadingHighlights, setIsLoadingHighlights] = useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 3000);
            };

            // 아빠의 Google 계정으로 로그인. Firebase Auth가 세션을 유지합니다.
            useEffect(() => {
                getRedirectResult(auth).catch((error) => {
                    console.warn('Google redirect login:', error);
                    setLoginError(`구글 로그인에 실패했어요. 오류 코드: ${error.code || 'unknown'} (${error.message || '상세 정보 없음'})`);
                });
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u || null);
                    setAuthReady(true);
                }, (error) => {
                    console.error('Auth state:', error);
                    setAuthReady(true);
                });
                return () => unsubscribe();
            }, []);

            const loginWithGoogle = async () => {
                setLoginBusy(true);
                setLoginError('');
                try {
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error('Google sign in:', error);
                    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(error.code)) {
                        try { await signInWithRedirect(auth, new GoogleAuthProvider()); return; }
                        catch (redirectError) { console.error('Redirect sign in:', redirectError); }
                    }
                    if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
                        setLoginError(`로그인할 수 없어요. 오류 코드: ${error.code || 'unknown'} (${error.message || '상세 정보 없음'})`);
                    }
                } finally {
                    setLoginBusy(false);
                }
            };

            const logoutGoogle = async () => {
                try { await signOut(auth); }
                catch (error) { console.error('Google sign out:', error); }
            };

            useEffect(() => {
                setRevealedIndices([]);
            }, [activeTab, currentDay, notesPage]); 

            // 모든 Day의 하이라이트 문장을 모아오는 Effect (로컬스토리지 + 파이어베이스 병합)
            useEffect(() => {
                const fetchGlobalHighlights = async () => {
                    if (!showHighlightedOnly || activeTab !== 'challenge') return;
                    
                    setIsLoadingHighlights(true);
                    let highlightsMap = new Map();

                    // 1. 로컬스토리지 우선 스캔
                    for (let d = 1; d <= 100; d++) {
                        try {
                            const localRaw = localStorage.getItem(`konee_local_day_${d}`);
                            if (localRaw) {
                                const parsed = JSON.parse(localRaw);
                                if (parsed.sentences) {
                                    parsed.sentences.forEach((s, idx) => {
                                        if (s.highlight) {
                                            highlightsMap.set(`${d}_${idx}`, { ...s, day: d, originalIndex: idx });
                                        }
                                    });
                                }
                            }
                        } catch (e) {}
                    }

                    // 2. 파이어베이스 스캔 및 병합
                    if (user) {
                        const studyDataRef = collection(db, 'artifacts', appId, 'users', SINGLE_USER_DOC_KEY, 'study_data');
                        try {
                            const snapshot = await getDocs(studyDataRef);
                            snapshot.forEach(docSnap => {
                                const id = docSnap.id;
                                if (id.startsWith('day_')) {
                                    const dayNum = parseInt(id.replace('day_', ''));
                                    const data = docSnap.data();
                                    if (data.sentences) {
                                        data.sentences.forEach((s, idx) => {
                                            if (s.highlight) {
                                                highlightsMap.set(`${dayNum}_${idx}`, { ...s, day: dayNum, originalIndex: idx });
                                            }
                                        });
                                    }
                                }
                            });
                        } catch (error) {
                            console.error("Error fetching global highlights:", error);
                        }
                    }

                    const allHighlights = Array.from(highlightsMap.values());
                    allHighlights.sort((a, b) => a.day !== b.day ? a.day - b.day : a.originalIndex - b.originalIndex);
                    setGlobalHighlights(allHighlights);
                    setIsLoadingHighlights(false);
                };

                fetchGlobalHighlights();
            }, [showHighlightedOnly, activeTab, user]);

            // Day를 바꿀 때마다 기기 데이터를 즉시 불러오되, 서버의 오래된 사본은 덮어쓰지 않습니다.
            useEffect(() => {
                const key = `konee_local_day_${currentDay}`;
                const defaultTopic = dayScheduleData[currentDay]?.title || `Day ${currentDay} 패턴 연습`;
                const fromLocal = localRead(key);
                setSentences(fromLocal?.sentences || getInitialSentencesForDay(currentDay));
                setRepetitionCount(fromLocal?.repetitionCount || 0);
                setTopic(fromLocal?.topic || defaultTopic);
                if (!user) return;
                const unsubscribe = onSnapshot(cloudDoc(`day_${currentDay}`), snapshot => {
                    if (!snapshot.exists()) {
                        // 기존 휴대폰에만 있는 기록도 나중에 백업합니다.
                        if (localRead(key)) {
                            localStorage.setItem(pendingKeyForLocal(key), '1');
                            flushAllLocal(user);
                        }
                        return;
                    }
                    const remote = snapshot.data();
                    if (!shouldUseCloudCopy(key, remote)) return;
                    try {
                        localStorage.setItem(key, JSON.stringify(remote));
                        setSentences(remote.sentences || getInitialSentencesForDay(currentDay));
                        setRepetitionCount(remote.repetitionCount || 0);
                        setTopic(remote.topic || defaultTopic);
                        window.dispatchEvent(new Event('konee-storage-updated'));
                    } catch (error) { console.error('Local restore failed:', error); setStorageFailure(true); }
                }, error => console.warn('Day cloud read unavailable:', error));
                flushAllLocal(user);
                return () => unsubscribe();
            }, [user, currentDay]);

            // 공통 기록도 기기 기록이 최신이면 무조건 유지. 서버의 구버전/빈 배열은 덮어쓰지 않음.
            useEffect(() => {
                if (!user) return;
                const key = 'konee_local_global';
                const unsubscribe = onSnapshot(cloudDoc('global_data'), snapshot => {
                    if (!snapshot.exists()) {
                        if (localRead(key)) {
                            localStorage.setItem('konee_pending_global', '1');
                            flushAllLocal(user);
                        }
                        return;
                    }
                    const remote = snapshot.data();
                    if (!shouldUseCloudCopy(key, remote)) return;
                    const normalized = { ...remote, completedDates: normalizeDates(remote.completedDates || []) };
                    try {
                        localStorage.setItem(key, JSON.stringify(normalized));
                        setNotes(normalized.notes || []);
                        setCompletedDates(normalized.completedDates);
                        if (normalized.silverAwarded !== undefined) setSilverAwarded(normalized.silverAwarded);
                        if (normalized.savedTimeLeft !== undefined && !normalized.timerEndTime) setTimeLeft(Math.max(0, Math.min(TIMER_SECONDS, Number(normalized.savedTimeLeft) || 0)));
                        window.dispatchEvent(new Event('konee-storage-updated'));
                    } catch (error) { console.error('Global local restore failed:', error); setStorageFailure(true); }
                }, error => console.warn('Global cloud read unavailable:', error));
                flushAllLocal(user);
                return () => unsubscribe();
            }, [user]);

            // 재접속, 네트워크 복구, 탭 복귀 때 모든 Day의 보류 기록을 재전송합니다.
            useEffect(() => {
                const update = () => {
                    setSyncStatus(storageFailure ? '기기 저장 오류 · 백업 필요'
                        : !user ? '기기에 저장됨 · 구글 로그인 필요'
                        : hasLocalWork() ? '기기에 저장됨 · 클라우드 동기화 대기'
                        : '클라우드 업로드 요청 완료 · 저장 기록 확인 권장');
                };
                const retry = () => { flushAllLocal(user); update(); };
                const onFocus = () => retry();
                const onVisibility = () => { if (!document.hidden) retry(); };
                window.addEventListener('online', retry);
                window.addEventListener('focus', onFocus);
                window.addEventListener('konee-storage-updated', update);
                document.addEventListener('visibilitychange', onVisibility);
                const timer = window.setInterval(retry, 30000);
                retry();
                return () => {
                    window.removeEventListener('online', retry);
                    window.removeEventListener('focus', onFocus);
                    window.removeEventListener('konee-storage-updated', update);
                    document.removeEventListener('visibilitychange', onVisibility);
                    clearInterval(timer);
                };
            }, [user, storageFailure]);

            const saveDayData = async (newSentences, newRepCount, newTopic = topic) => {
                const key = `konee_local_day_${currentDay}`;
                const ok = saveLocallyFirst(key, { sentences: newSentences, repetitionCount: newRepCount, topic: newTopic });
                if (!ok) { setStorageFailure(true); return; }
                if (user) flushOneLocal(key, user);
            };

            const saveGlobalData = async (updates) => {
                const key = 'konee_local_global';
                const previous = localRead(key) || {};
                const ok = saveLocallyFirst(key, { ...previous, ...updates, lastTimerDate: getLocalToday() });
                if (!ok) { setStorageFailure(true); return; }
                if (user) flushOneLocal(key, user);
            };

            const triggerGoalAchieved = async (type) => {
                const today = getLocalToday();
                let loadedDates = [...completedDates];
                const existingIndex = loadedDates.findIndex(r => r.date === today);
                if (existingIndex !== -1) {
                    if (type === '30gold' && !['30gold', '60'].includes(loadedDates[existingIndex].type)) {
                        loadedDates[existingIndex] = { date: today, type: '30gold' };
                    }
                } else {
                    loadedDates.push({ date: today, type: type });
                }
                setCompletedDates(loadedDates);
                saveGlobalData({ completedDates: loadedDates });

                if (type === '30gold') {
                    setShowCelebration(true);
                    setTimeout(() => setShowCelebration(false), 5000);
                }
            };

            useEffect(() => {
                let interval = null;
                if (isActive && timerEndTime) {
                    interval = setInterval(() => {
                        const now = Date.now();
                        const diff = Math.ceil((timerEndTime - now) / 1000);

                        if (diff <= SILVER_SECONDS && diff > 0 && !silverAwarded) {
                            setSilverAwarded(true);
                            saveGlobalData({ silverAwarded: true });
                            triggerGoalAchieved('15');
                        }
                        if (diff <= 0) {
                            setTimeLeft(0);
                            setIsActive(false);
                            setTimerEndTime(null);
                            setSilverAwarded(true);
                            triggerGoalAchieved('30gold');
                            saveGlobalData({ timerEndTime: null, savedTimeLeft: 0, silverAwarded: true });
                        } else {
                            setTimeLeft(diff);
                        }
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isActive, timerEndTime, silverAwarded, user]);

            // 자정 자동 리셋
            useEffect(() => {
                const lastCheckedDate = { current: getLocalToday() };
                
                const midnightCheck = setInterval(() => {
                    const now = getLocalToday();
                    if (now !== lastCheckedDate.current) {
                        lastCheckedDate.current = now;
                        setTimeLeft(TIMER_SECONDS);
                        setTimerEndTime(null);
                        setIsActive(false);
                        setSilverAwarded(false);
                        saveGlobalData({ timerEndTime: null, savedTimeLeft: TIMER_SECONDS, silverAwarded: false });
                    }
                }, 30000);

                return () => clearInterval(midnightCheck);
            }, [user]);

            const handleStartTimer = () => {
                if (isActive) {
                    setIsActive(false);
                    setTimerEndTime(null);
                    saveGlobalData({ timerEndTime: null, savedTimeLeft: timeLeft }); 
                } else {
                    const duration = timeLeft > 0 ? timeLeft : TIMER_SECONDS; 
                    const isNewStart = duration === TIMER_SECONDS;
                    if (isNewStart) setSilverAwarded(false);

                    const newEndTime = Date.now() + duration * 1000;
                    setTimerEndTime(newEndTime);
                    setIsActive(true);
                    
                    const updates = { timerEndTime: newEndTime, savedTimeLeft: duration };
                    if (isNewStart) updates.silverAwarded = false;
                    saveGlobalData(updates);
                }
            };

            const handleResetTimer = () => {
                setIsActive(false);
                setTimerEndTime(null);
                setTimeLeft(TIMER_SECONDS);
                setSilverAwarded(false);
                saveGlobalData({ timerEndTime: null, savedTimeLeft: TIMER_SECONDS, silverAwarded: false });
            };

            const updateSentence = (index, field, value) => {
                const newSentences = [...sentences];
                newSentences[index] = { ...newSentences[index], [field]: value };
                setSentences(newSentences);
                saveDayData(newSentences, repetitionCount);
            };

            const toggleHighlight = async (index, isNote = false, noteId = null, isGlobal = false) => {
                if (isNote) {
                    const newNotes = notes.map(n => 
                        n.id === noteId ? { ...n, highlight: !n.highlight } : n
                    );
                    setNotes(newNotes);
                    await saveGlobalData({ notes: newNotes });
                } else if (isGlobal) {
                    const globalItem = globalHighlights[index];
                    setGlobalHighlights(prev => prev.filter((_, i) => i !== index));
                    
                    if (globalItem.day === currentDay) {
                        const newSentences = [...sentences];
                        if (newSentences[globalItem.originalIndex]) {
                            newSentences[globalItem.originalIndex].highlight = false;
                            setSentences(newSentences);
                        }
                    }

                    // 로컬스토리지 업데이트
                    try {
                        const localRaw = localStorage.getItem(`konee_local_day_${globalItem.day}`);
                        if (localRaw) {
                            const parsed = JSON.parse(localRaw);
                            if (parsed.sentences && parsed.sentences[globalItem.originalIndex]) {
                                parsed.sentences[globalItem.originalIndex].highlight = false;
                                saveLocallyFirst(`konee_local_day_${globalItem.day}`, parsed);
                                flushAllLocal(user);
                            }
                        }
                    } catch (e) {}
                    

                } else {
                    const newSentences = [...sentences];
                    newSentences[index] = { 
                        ...newSentences[index], 
                        highlight: !newSentences[index].highlight 
                    };
                    setSentences(newSentences);
                    saveDayData(newSentences, repetitionCount);
                }
            };

            const toggleRepetition = (index) => {
                let newCount = index + 1;
                if (repetitionCount === newCount) newCount = index; 
                setRepetitionCount(newCount);
                saveDayData(sentences, newCount);
            };

            const speakText = (text) => {
                if (!text) return;
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/~/g, ' ');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.95; 
                window.speechSynthesis.speak(utterance);
            };

            const addNote = async () => {
                if (!newNoteEng.trim()) return;
                const newNote = { 
                    id: Date.now(), 
                    eng: newNoteEng, 
                    kor: newNoteKor,
                    tag: newNoteTag.trim() || "",
                    date: new Date().toLocaleDateString(),
                    highlight: false
                };
                
                const newNoteList = [newNote, ...notes];
                setNotes(newNoteList);
                setNewNoteEng("");
                setNewNoteKor("");
                setNewNoteTag("");
                setNotesPage(1);
                
                try {
                    await saveGlobalData({ notes: newNoteList });
                    showToast("표현이 저장되었습니다!");
                } catch (error) {
                    console.error("Error adding note:", error);
                    showToast("로컬에 저장되었습니다.");
                }
            };

            const deleteNote = async (id) => {
                const newNoteList = notes.filter(n => n.id !== id);
                setNotes(newNoteList);

            const saveEdit = async () => {

            // Day 변경 시 해당 유튜브 타임라인 표시 갱신
            const selectDay = (dayNum, autoStartVideo = true) => {
                const clamped = Math.min(100, Math.max(1, dayNum));

            const formatTime = (seconds) => {

            const totalPages = Math.ceil(filteredNotes.length / NOTES_PER_PAGE);

            // Streak 계산
            const calculateStreak = () => {
                if (!completedDates || completedDates.length === 0) return { current: 0, best: 0 };
                
                const sortedDates = [...completedDates]
                    .map(d => d.date)
                    .sort((a, b) => b.localeCompare(a));
                
                const unique = [...new Set(sortedDates)];
                
                let currentStreak = 0;
                const today = getLocalToday();
                const yesterday = (() => {
                    const d = new Date();
                    d.setDate(d.getDate() - 1);
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                })();
                
                let startIdx = unique.indexOf(today);
                if (startIdx === -1) startIdx = unique.indexOf(yesterday);
                
                if (startIdx !== -1) {
                    for (let i = startIdx; i < unique.length; i++) {
                        const expected = new Date();
                        expected.setDate(expected.getDate() - (i - startIdx) - (unique[startIdx] === yesterday ? 1 : 0));
                        const expectedStr = `${expected.getFullYear()}-${String(expected.getMonth() + 1).padStart(2, '0')}-${String(expected.getDate()).padStart(2, '0')}`;
                        if (unique[i] === expectedStr) {
                            currentStreak++;
                        } else {
                            break;
                        }
                    }
                }
                
                let bestStreak = 0;
                let tempStreak = 1;
                const sortedAsc = [...unique].sort();
                for (let i = 1; i < sortedAsc.length; i++) {
                    const prev = new Date(sortedAsc[i - 1]);
                    const curr = new Date(sortedAsc[i]);
                    const diff = (curr - prev) / (1000 * 60 * 60 * 24);
                    if (diff === 1) {
                        tempStreak++;
                    } else {
                        bestStreak = Math.max(bestStreak, tempStreak);
                        tempStreak = 1;
                    }
                }
                bestStreak = Math.max(bestStreak, tempStreak);
                
                return { current: currentStreak, best: bestStreak };
            };
            
            const streak = calculateStreak();

            // 랜덤 복습
            const generateRandomNotes = () => {
                if (notes.length === 0) {

            // 내보내기 (CSV)
            const exportNotesCSV = () => {
                if (notes.length === 0) {
                    showToast("내보낼 노트가 없습니다.");

                const BOM = '\uFEFF';
                const header = 'English,Korean,Tag,Date\n';
                const rows = notes.map(n => {
                    const eng = `"${(n.eng || '').replace(/"/g, '""')}"`;
                    const kor = `"${(n.kor || '').replace(/"/g, '""')}"`;
                    const tag = `"${(n.tag || '').replace(/"/g, '""')}"`;
                    const date = `"${(n.date || '').replace(/"/g, '""')}"`;
                    return `${eng},${kor},${tag},${date}`;
                }).join('\n');
                
                const blob = new Blob([BOM + header + rows], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `konees_english_notes_${getLocalToday()}.csv`;
                document.body.appendChild(link);
                link.click();

                URL.revokeObjectURL(url);
                showToast("CSV 파일이 다운로드되었습니다.");

            // 전체 학습 기록 백업: 표현, Day별 연습 문장, 달력, 선택 Day
            const exportFullBackup = () => {
                const payload = { format: 'konees-english-backup-v1', exportedAt: new Date().toISOString(), storage: {} };
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && (key.startsWith('konee_') || key === 'koneeLastVisitedDay')) {
                        payload.storage[key] = localStorage.getItem(key);
                    }
                }
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `konees_full_backup_${getLocalToday()}.json`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
                showToast('전체 학습 기록 백업 파일을 저장했어요.');
            };

            // 백업은 기존 기록을 자동 삭제하지 않고, 사용자가 선택한 파일만 검증 후 병합합니다.
            const restoreBackup = async (event) => {
                const file = event.target.files?.[0];
                event.target.value = '';
                if (!file) return;
                try {
                    const data = JSON.parse(await file.text());
                    if (data.format !== 'konees-english-backup-v1' || !data.storage || typeof data.storage !== 'object') {
                        throw new Error('이 사이트의 백업 파일이 아닙니다.');
                    }
                    const entries = Object.entries(data.storage).filter(([key, value]) =>
                        (/^konee_local_day_\d+$/.test(key) || key === 'konee_local_global' || key === 'koneeLastVisitedDay') && typeof value === 'string');
                    if (!entries.length) throw new Error('복원할 기록이 없습니다.');
                    if (!window.confirm(`백업의 ${entries.length}개 항목을 기기 기록에 병합할까요? 기존 항목 중 더 최근에 저장한 데이터는 유지합니다.`)) return;
                    for (const [key, raw] of entries) {
                        if (key === 'koneeLastVisitedDay') {
                            if (!localStorage.getItem(key)) localStorage.setItem(key, raw);
                            continue;
                        }
                        const imported = JSON.parse(raw);
                        if (!imported || typeof imported !== 'object' || Array.isArray(imported)) continue;
                        const existing = localRead(key);
                        // 타임스탬프가 없는 오래된 백업은 현재 기록이 없을 때만 복원.
                        if (existing && Number(existing.updatedAt || 0) >= Number(imported.updatedAt || 0)) continue;
                        saveLocallyFirst(key, imported);
                    }
                    flushAllLocal(user);
                    alert('백업을 병합했습니다. 화면을 다시 불러와 복원된 기록을 확인해 주세요.');
                    window.location.reload();
                } catch (error) {
                    console.error('Restore rejected:', error);
                    alert(`복원하지 못했습니다: ${error.message}`);
                }
            };

            // Web Push: 실제 발송은 GitHub Actions 예약 작업이 수행합니다.
            // 앱이 꺼져도 알림을 받으려면 아이폰에서 홈 화면에 추가 후 이 버튼을 눌러야 합니다.

                    return;
                }
                let cancelled = false;
                (async () => {
                    try {

                        if (!cancelled) {
                            setPushEnabled(!!subscription && Notification.permission === 'granted');
                            setPushStatus(subscription && Notification.permission === 'granted' ? '이 기기에서 알림이 활성화되어 있어요. (서버 예약 발송 설정 필요)' : '알림을 켜면 매일 밤 9시 알림을 받을 수 있어요.');

                return () => { cancelled = true; };

            const enableDailyPush = async () => {
                if (!user || pushBusy) return;

                    setPushStatus('아이폰 Safari 공유 → 홈 화면에 추가 후, 홈 화면의 앱을 실행해서 눌러 주세요.');
                    return;
                }
                if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
                    setPushStatus('이 환경에서는 웹 푸시가 지원되지 않아요.');
                    return;
                }
                setPushBusy(true);
                try {
                    // Request on direct user click (important for iOS).
                    const permission = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
                    if (permission !== 'granted') throw new Error('알림 권한이 거부되었어요. iPhone 설정 → 알림에서 앱 알림을 허용해 주세요.');
                    const registration = await navigator.serviceWorker.register('./sw.js', {scope: './'});
                    await navigator.serviceWorker.ready;
                    let subscription = await registration.pushManager.getSubscription();
                    if (!subscription) subscription = await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKeyBytes(PUSH_PUBLIC_KEY)});
                    await setDoc(doc(db, 'push_subscriptions', user.uid), {

                        updatedAt: new Date().toISOString(),

                    setPushEnabled(true);
                    setPushStatus('이 기기에서 알림 수신 등록 완료! 서버의 밤 9시 발송 설정도 완료해야 실제 알림이 와요.');
                } catch (error) {
                    console.error('Push subscribe failed:', error);
                    setPushStatus('알림 등록 실패: ' + (error.code ? error.code + ' / ' : '') + error.message);

                                    {authReady ? (user ? '✓ 로그인됨' : '로그인 필요') : '로그인 확인 중...'}
                                </span>

                                    {pushEnabled ? '🔔 9시 알림 켜짐' : '🔕 9시 알림 꺼짐'}

                                <p className="text-[11px] text-slate-500 truncate">설정이 끝났다면 평소에는 이 줄만 보고 사용해도 돼요.</p>

                                        <div className="min-w-0">
                                            <p className="text-sm font-bold text-violet-800">✓ 구글 로그인: {user.displayName || user.email || '로그인 완료'}</p>

                        {/* 클라우드 저장 및 전체 백업 기능: 학습 화면이 아닌 설정 메뉴 내부에서만 표시 */}

                            <div className="mt-3 flex flex-wrap gap-2">
                                <button onClick={() => { flushAllLocal(user); showToast('미전송 기록 재전송을 시도합니다.'); }} className="bg-white border border-slate-200 text-slate-700 rounded-xl px-3 py-2.5 text-xs font-extrabold">다시 저장</button>

                                    <div>
                                        <h3 className="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                                            <BookOpen size={20} className="text-[#7C3AED]" />

                                        </h3>
                                        <p className="text-xs text-slate-400 mt-0.5">선택하면 해당 영상 구간으로 바로 이동합니다</p>

                                    </button>
                                </div>

                                <div className="grid grid-cols-7 gap-y-2.5 gap-x-1 text-center">
                                    {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, idx) => (
                                        <div key={idx} className="text-[10px] font-bold text-[#A78BFA] uppercase mb-1">{d}</div>
                                    ))}
                                    {Array.from({ length: getFirstDayOfMonth(viewDate.getFullYear(), viewDate.getMonth()) }).map((_, i) => (
                                        <div key={`empty-${i}`} />
                                    ))}
                                    {Array.from({ length: getDaysInMonth(viewDate.getFullYear(), viewDate.getMonth()) }).map((_, i) => {
                                        const day = i + 1;
                                        const dateStr = `${viewDate.getFullYear()}-${String(viewDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                        
                                        const record = completedDates.find(d => d.date === dateStr);
                                        const isCompleted = !!record;
                                        const stampType = record ? record.type : null;
                                        
                                        const todayStr = getLocalToday();
                                        const isToday = dateStr === todayStr;
                                        
                                        let stampStyle = '';
                                        let stampText = day;
                                        
                                        if (isCompleted) {
                                            if (stampType === '15' || stampType === '30') { // 이전 30분 은메달 기록도 은메달로 유지
                                                stampStyle = 'bg-slate-200 border-slate-300 text-slate-600 scale-105';
                                                stampText = "☆";
                                            } else {
                                                stampStyle = 'bg-yellow-400 border-yellow-400 text-black shadow-md shadow-yellow-400/20 scale-105';
                                                stampText = "★";
                                            }
                                        } else if (isToday) {
                                            stampStyle = 'bg-white/10 border-[#7C3AED] text-white ring-2 ring-[#7C3AED]/50';
                                        } else {
                                            stampStyle = 'bg-transparent border-transparent text-white/40';
                                        }

                                        return (
                                            <div key={day} className="flex flex-col items-center">
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold border transition-all ${stampStyle}`}>
                                                    {stampText}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="mt-4 flex justify-center gap-4 text-[10px] text-white/50">
                                    <div className="flex items-center gap-1"><span className="text-yellow-400">★</span> 30min</div>
                                    <div className="flex items-center gap-1"><span className="text-slate-300">☆</span> 15min</div>
                                </div>
                            </div>
                            {/* Streak Counter */}
                            <div className="bg-gradient-to-br from-[#7C3AED] to-[#5B21B6] text-white rounded-[2rem] p-5 sm:p-6 shadow-xl relative overflow-hidden">
                                <div className="absolute top-[-10px] right-[-10px] w-24 h-24 bg-yellow-400 rounded-full blur-[50px] opacity-30 pointer-events-none"></div>
                                <div className="flex items-center justify-between relative z-10">
                                    <div>
                                        <p className="text-xs font-bold text-white/60 uppercase tracking-wider mb-1">Current Streak</p>
                                        <div className="flex items-baseline gap-2">
                                            <span className="text-4xl sm:text-5xl font-black">{streak.current}</span>
                                            <span className="text-base font-bold text-white/80">일 연속</span>
                                        </div>
                                    </div>
                                    <div className="text-5xl">{streak.current >= 7 ? '🔥' : streak.current >= 3 ? '✨' : '💪'}</div>
                                </div>
                                <div className="mt-4 pt-3.5 border-t border-white/10 flex justify-between items-center relative z-10">
                                    <div className="flex items-center gap-2">
                                        <Trophy size={14} className="text-yellow-300"/>
                                        <span className="text-xs font-bold text-white/70">최장 기록</span>
                                    </div>
                                    <span className="text-sm font-black text-yellow-300">{streak.best}일</span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudyApp />);
    </script>
</body>
</html>
